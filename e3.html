<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<title>Exercise 3 - To-Do List with Local Storage</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  #taskInput { width: 250px; padding: 4px; }
  #addBtn { padding: 4px 10px; }
  ul { list-style-type: disc; margin-top: 20px; }
  li { margin: 6px 0; }
  li button {
    margin-left: 10px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    padding: 2px 6px;
  }
</style>
</head>
<body>
<input type="text" id="taskInput" placeholder="enter the task...">
<button id="addBtn">Add Task</button>
<ul id="taskList"></ul>
<script>
  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('taskList');
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  function renderTasks() {
    list.innerHTML = '';
    tasks.forEach((task, index) => {
      const li = document.createElement('li');
      li.textContent = task;
      const delBtn = document.createElement('button');
      delBtn.textContent = 'delete';
      delBtn.onclick = () => {
        tasks.splice(index, 1);
        saveTasks();
        renderTasks();
      };
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }
  function saveTasks() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }
  addBtn.onclick = () => {
    const value = input.value.trim();
    if (value) {
      tasks.push(value);
      input.value = '';
      saveTasks();
      renderTasks();
    }
  };
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addBtn.click();
  });
  renderTasks();
</script>
</body>
</html>
