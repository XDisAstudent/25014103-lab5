<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<title>Canvas smile face</title>
<style>
  body {
    background-color: #8FE3A8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
  }
  h1 {
    color: #1a1a1a;
    font-size: 22px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<canvas id="smiley" width="400" height="420"></canvas>
<h1>The Canvas brought me to life!</h1>
<script>
const canvas = document.getElementById('smiley');
const ctx = canvas.getContext('2d');
// background
ctx.fillStyle = '#8FE3A8';
ctx.fillRect(0, 0, canvas.width, canvas.height);
// face
const cx = 200, cy = 200, radius = 150;
ctx.beginPath();
ctx.arc(cx, cy, radius, 0, Math.PI * 2);
ctx.fillStyle = '#FFEE00';
ctx.fill();
ctx.strokeStyle = '#000';
ctx.lineWidth = 1;
ctx.stroke();
// eyes
ctx.beginPath();
ctx.arc(cx - 55, cy - 40, 12, 0, Math.PI * 2);
ctx.fillStyle = '#000';
ctx.fill();
ctx.beginPath();
ctx.arc(cx + 55, cy - 40, 12, 0, Math.PI * 2);
ctx.fill();
// nose
ctx.beginPath();
ctx.moveTo(cx, cy - 10);
ctx.lineTo(cx, cy + 40);
ctx.strokeStyle = '#000';
ctx.lineWidth = 1;
ctx.stroke();
//mouth
ctx.beginPath();
ctx.arc(cx, cy + 20, 70, 0.2 * Math.PI, 0.8 * Math.PI);
ctx.strokeStyle = '#000';
ctx.lineWidth = 1.5;
ctx.stroke();
</script>
</body>
</html>
